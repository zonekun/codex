# 2023 バックフィル #1（ticker 1301-1909、~3,091 doc）
# パターン: load 1回 → workflows 1回（通し検証、Phase I 507 doc のスケールアップ）
# 参照: docs/plans/20260417_091112_tdnet_load_ai_split.md「2023 バックフィル ticker 11分割」

name: 2023_batch01

loads:
  - job: tdnet-load-daily
    region: us-west1
    env:
      DATE_FROM: "20230101"
      DATE_TO: "20231231"
      TICKER_FROM: "1301"
      TICKER_TO: "1909"

workflows:
  - name: ai_processing_flow
    location: us-central1
    data:
      date_from: "20230101"
      date_to: "20231231"
      ticker_from: "1301"
      ticker_to: "1909"

options:
  parallel_loads: 1
  poll_interval_s: 120
  notify_on_start: true
  notify_each_load: false
