name: 2017_full_run2_h2

loads:
  - job: tdnet-load-daily
    region: us-west1
    env:
      DATE_FROM: "20170701"
      DATE_TO: "20171231"
      ALLOW_FULL_BACKFILL: "1"
    args: ["--job-mode=load"]

workflows:
  - name: ai_processing_flow
    location: us-central1
    data:
      date_from: "20170701"
      date_to: "20170930"
  - name: ai_processing_flow
    location: us-central1
    data:
      date_from: "20171001"
      date_to: "20171231"

options:
  parallel_loads: 1
  poll_interval_s: 120
  notify_on_start: true
  notify_each_load: true
