[project]
name = "investment-agent"
version = "0.1.0"
description = "自律型投資AIエージェント - アイディア抽出から自動売買まで"
requires-python = ">=3.12"
dependencies = [
    # --- Core ---
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "apscheduler>=3.10",
    "curl-cffi>=0.6",
    "aiohttp>=3.9",
    # --- Data ---
    "pandas>=2.2",
    "numpy>=1.26",
    # --- Data / GCP ---
    "google-cloud-bigquery>=3.20",
    "google-cloud-storage>=2.16",
    "google-cloud-logging>=3.0",
    "google-cloud-run>=0.10",
    "db-dtypes>=1.2",
    "pyarrow>=15.0",
    "diskcache>=5.6",
    # --- Analysis ---
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    # --- LLM ---
    "anthropic>=0.40",
    # --- Sources ---
    "yt-dlp>=2024.0",
    "youtube-transcript-api>=0.6",
    "tweepy>=4.14",
    "arxiv>=2.1",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "playwright>=1.40",
    "selenium>=4.20",
    "google-generativeai>=0.8",
    "pillow>=10.0",
    "yfinance>=0.2",
    # --- API ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # --- Dashboard ---
    "streamlit>=1.35",
    "plotly>=5.20",
    "openpyxl>=3.1.5",
    "pypdf>=6.8.0",
    "pdfminer-six>=20231228",
    "google-cloud-aiplatform>=1.141.0",
    "jquants-api-client>=2.0.1",
    "mcp>=1.26.0",
    "playwright-stealth>=2.0.2",
    "undetected-chromedriver>=3.5.5",
    "setuptools>=82.0.1",
    "imbalanced-learn>=0.14.1",
    "optuna>=4.8.0",
    "shap>=0.44",
    "numba>=0.57",
    "webdriver-manager>=4.0.2",
    "rapidfuzz>=3.14.3",
    "jaconv>=0.5.0",
    "pdfplumber>=0.11",
    "pypdf2>=3.0.1",
    "langchain-text-splitters>=1.1.1",
    "pymupdf>=1.27.2.2",
    "google-genai>=1.67.0",
    "browser-use>=0.11.13",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "tabula-py>=2.10.0",
    "ddgs>=9.12.1",
    "jpholiday>=1.0.3",
    "nodriver>=0.48.1",
    "google-cloud-bigquery-storage>=2.37.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
