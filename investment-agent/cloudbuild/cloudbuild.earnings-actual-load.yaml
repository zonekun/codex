steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - docker/Dockerfile.earnings-actual-load
      - -t
      - us-west1-docker.pkg.dev/gmailpj-357912/tools/earnings-actual-load:latest
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - us-west1-docker.pkg.dev/gmailpj-357912/tools/earnings-actual-load:latest
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Updating job: earnings-actual-load"
        gcloud run jobs update earnings-actual-load --region=us-west1 \
          --image=us-west1-docker.pkg.dev/gmailpj-357912/tools/earnings-actual-load:latest

images:
  - us-west1-docker.pkg.dev/gmailpj-357912/tools/earnings-actual-load:latest
